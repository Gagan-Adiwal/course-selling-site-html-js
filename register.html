<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register / Login - MyCourses</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">MyCourses</div>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="courses.html">Courses</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="register.html" class="active">Register</a></li>
    </ul>
    <div class="menu-toggle" id="menuToggle">&#9776;</div>
  </nav>

  <!-- Register/Login Container -->
  <section class="hero auth-hero">
    <div class="auth-container">

      <!-- Toggle Buttons -->
      <div class="toggle-btns">
        <button id="loginBtn" class="active">Login</button>
        <button id="signupBtn">Signup</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="form active">
        <h2>Login</h2>
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Login</button>
        <p class="switch-text">Don’t have an account? <span id="switchToSignup">Signup</span></p>
      </form>

      <!-- Signup Form -->
      <form id="signupForm" class="form">
        <h2>Signup</h2>
        <input type="text" placeholder="Full Name" required>
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Password" required>
        <input type="password" placeholder="Confirm Password" required>
        <button type="submit">Signup</button>
        <p class="switch-text">Already have an account? <span id="switchToLogin">Login</span></p>
      </form>

    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 MyCourses. All rights reserved.</p>
  </footer>

  <!-- Scripts -->
  <script src="script.js"></script>
</body>
</html>
